[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-vllm"
version = "0.1.0"
description = "CPU educational continuous batching with physical paged KV and prefix reuse"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[project.scripts]
mini-vllm = "mini_vllm.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["mini_vllm*", "benchmarks*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
